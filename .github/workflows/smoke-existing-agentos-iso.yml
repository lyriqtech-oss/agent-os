name: Boot smoke test for built AgentOS ISO

on:
  push:
    branches: [agentos-linux-foundation]
    paths: ['.github/workflows/smoke-existing-agentos-iso.yml']

permissions:
  actions: read
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the validated ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p os
          gh run download 40605113149 -n lyriq-agentos-live-amd64 -D os
          cd os
          sha256sum -c live-image-amd64.hybrid.iso.sha256
      - name: Boot the live system in QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          cd os
          qemu-img create -f qcow2 agentos-smoke.qcow2 16G
          accel=tcg
          if [ -r /dev/kvm ]; then accel=kvm; fi
          (
            sleep 5
            printf 'sendkey ret\n'
            sleep 300
            printf 'screendump agentos-boot-300s.ppm\n'
            sleep 120
            printf 'screendump agentos-boot-420s.ppm\n'
            sleep 2
            printf 'sendkey ctrl-alt-f2\n'
            sleep 5
            printf 'screendump agentos-tty2.ppm\n'
            sleep 2
            printf 'quit\n'
          ) | timeout 500 qemu-system-x86_64 -machine "accel=$accel" -m 3072 -smp 2 \
            -drive file=agentos-smoke.qcow2,format=qcow2,if=virtio \
            -cdrom live-image-amd64.hybrid.iso -boot d -vga std -display none \
            -monitor stdio -serial file:agentos-boot-enter-serial.log
          test -s agentos-boot-420s.ppm
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentos-boot-after-enter
          path: |
            os/agentos-boot-300s.ppm
            os/agentos-boot-420s.ppm
            os/agentos-tty2.ppm
            os/agentos-boot-enter-serial.log
          if-no-files-found: warn
