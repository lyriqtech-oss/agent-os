name: Build AgentOS live ISO

on:
  workflow_dispatch:
  push:
    branches: [agentos-linux-foundation]
    paths:
      - 'os/**'
      - '.github/workflows/build-agentos-iso.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install live-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-efi-amd64-bin
      - name: Build ISO
        working-directory: os
        run: sudo sh ./build.sh
      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: lyriq-agentos-live-amd64
          path: |
            os/*.iso
            os/*.iso.sha256
          if-no-files-found: error

